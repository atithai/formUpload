<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="form-container">
    <h2>Contact Us</h2>
    
    <!-- กล่องแสดงข้อความสถานะ (สำเร็จ/ผิดพลาด) -->
    <div id="status-message" class="status-message hidden"></div>

    <form id="contact-form">
      <div class="form-group">
        <label for="name">Name</label>
        <input type="text" id="name" name="Name" placeholder="กรอกชื่อ-นามสกุล" required />
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="Email" placeholder="example@email.com" required />
      </div>

      <div class="form-group">
        <label for="phone">Phone</label>
        <input type="tel" id="phone" name="Phone" placeholder="08X-XXX-XXXX" required />
      </div>

      <div class="form-group">
        <label for="comment">Comment</label>
        <textarea id="comment" name="Comment" rows="4" placeholder="กรอกข้อความของคุณ..." required></textarea>
      </div>

      <button type="submit" id="submit-btn">
        <span class="btn-text">Submit</span>
        <span class="spinner hidden"></span>
      </button>
    </form>
  </div>

  <script>
    // ⚠️ นำ Web App URL ที่ได้จากการ Deploy Apps Script มาวางตรงนี้
    const SCRIPT_URL = 'YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL';

    const form = document.getElementById('contact-form');
    const submitBtn = document.getElementById('submit-btn');
    const btnText = submitBtn.querySelector('.btn-text');
    const spinner = submitBtn.querySelector('.spinner');
    const statusMessage = document.getElementById('status-message');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      // ล้างสถานะเดิม และเปลี่ยนสถานะปุ่มเป็น Loading
      hideStatus();
      setLoading(true);

      const payload = {
        name: form.Name.value.trim(),
        email: form.Email.value.trim(),
        phone: form.Phone.value.trim(),
        comment: form.Comment.value.trim()
      };

      try {
        await fetch(SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(payload)
        });

        // แสดงข้อความสำเร็จ
        showStatus('ส่งข้อมูลเรียบร้อยแล้ว! ระบบได้ส่งอีเมลยืนยันไปยังอีเมลของคุณแล้ว', 'success');
        form.reset();

      } catch (error) {
        console.error('Error!', error);
        showStatus('เกิดข้อผิดพลาด ไม่สามารถส่งข้อมูลได้ กรุณาลองใหม่อีกครั้ง', 'error');
      } finally {
        setLoading(false);
      }
    });

    function setLoading(isLoading) {
      submitBtn.disabled = isLoading;
      if (isLoading) {
        btnText.textContent = 'กำลังส่งข้อมูล...';
        spinner.classList.remove('hidden');
      } else {
        btnText.textContent = 'Submit';
        spinner.classList.add('hidden');
      }
    }

    function showStatus(text, type) {
      statusMessage.textContent = text;
      statusMessage.className = `status-message ${type}`;
    }

    function hideStatus() {
      statusMessage.textContent = '';
      statusMessage.className = 'status-message hidden';
    }
  </script>

</body>
</html>
